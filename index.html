  .title { font-size:2.2rem; font-weight:800; line-height:1.1; margin-bottom:15px; text-transform:uppercase; color:#fff; letter-spacing:-.5px; }
  .subtitle { font-size:1rem; color:#fff; margin-bottom:25px; font-weight:600; }
  .features { font-size:.9rem; color:#cbd5e1; line-height:1.8; margin-bottom:35px; padding:0 10px; }

  @keyframes breatheAndGlow {
    0% { transform:scale(1); box-shadow:0 0 10px rgba(255,140,0,.2); }
    50% { transform:scale(1.02); box-shadow:0 0 15px rgba(255,140,0,.4); }
    100% { transform:scale(1); box-shadow:0 0 10px rgba(255,140,0,.2); }
  }
  .btn {
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    background:linear-gradient(90deg,#ff9100 0%,#ff6600 100%); color:#fff;
    text-decoration:none; padding:18px 20px; border-radius:35px; font-weight:800;
    font-size:1.1rem; text-transform:uppercase; position:relative; z-index:1;
    margin-bottom:12px; letter-spacing:.5px; border:none; cursor:pointer;
    animation:breatheAndGlow 2.5s infinite ease-in-out; transition:filter .2s ease;
  }
  .btn:active { filter:brightness(.9); }
  .redirect-text { font-size:.8rem; color:#94a3b8; margin-bottom:25px; }

  .stats-container { display:flex; justify-content:space-between; border-top:1px solid rgba(255,255,255,.08); padding-top:25px; }
  .stat-box { flex:1; }
  .stat-value { color:#ffb84d; font-size:1.25rem; font-weight:800; margin-bottom:4px; }
  .stat-label { color:#94a3b8; font-size:.65rem; font-weight:600; letter-spacing:1px; text-transform:uppercase; }

  /* Edit tooling */
  #editPanel * { font-family:'Courier New',monospace; box-sizing:border-box; }
  #editPanel textarea, #editPanel input[type=text] {
    width:100%; background:#151816; border:1px solid #232622; color:#eef0ee;
    padding:8px; border-radius:6px; font-size:12.5px; font-family:'Courier New',monospace;
  }
  #editPanel textarea:focus, #editPanel input:focus{ outline:1px solid #00ff9c; }
  #editPanel button.act { background:#00ff9c; color:#04120c; border:none; font-weight:700; padding:6px 10px; border-radius:5px; font-size:11px; cursor:pointer; }
  #editPanel button.sec { background:transparent; color:#00ff9c; border:1px solid #0a6b47; padding:6px 10px; border-radius:5px; font-size:11px; cursor:pointer; }
  #editPanel button.clr { background:transparent; color:#ff5c5c; border:1px solid #5c2323; padding:6px 10px; border-radius:5px; font-size:11px; cursor:pointer; }
  #editToggle {
    position:fixed; bottom:16px; right:16px; z-index:99999;
    background:#00ff9c; color:#04120c; border:none; font-weight:700;
    padding:12px 16px; border-radius:30px; font-family:'Courier New',monospace;
    font-size:13px; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,0.4);
  }
  #editPanel {
    position:fixed; top:0; right:0; height:100vh; width:380px; max-width:92vw;
    background:#070808; border-left:1px solid #232622; z-index:99998;
    overflow-y:auto; padding:18px; transform:translateX(100%);
    transition:transform 0.25s ease; color:#eef0ee;
  }
  #editPanel.open { transform:translateX(0); }
  #editPanel h2 { color:#00ff9c; font-size:13px; text-transform:uppercase; letter-spacing:1px; margin:14px 0 12px; }
  #editPanel h2:first-child { margin-top:0; }
  .field-card { background:#101211; border:1px solid #232622; border-radius:8px; padding:10px; margin-bottom:10px; }
  .field-card label { display:block; color:#8a938e; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
  .field-status { color:#8a938e; font-size:10.5px; margin-top:4px; min-height:14px; }
  .field-status.ok { color:#00ff9c; }
  .field-status.err { color:#ff5c5c; }
  .redirect-option { background:#101211; border:1px solid #232622; border-radius:8px; padding:10px; margin-bottom:14px; }
  .redirect-option label { color:#eef0ee; font-size:11.5px; display:flex; align-items:center; gap:8px; cursor:pointer; }
  .redirect-option p { color:#8a938e; font-size:10.5px; margin:6px 0 0; }
</style>

<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20, #15102a, #06040a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Container & Entrance Animation */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px 25px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            animation: fadeInUp 0.8s ease-out forwards;
        }

        /* Logo Pulse Effect */
        .logo-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff2a2a;
            box-shadow: 0 0 20px rgba(255, 42, 42, 0.5);
            animation: pulseGlow 2s infinite alternate;
        }

        /* Typography & Badges */
        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 136, 204, 0.2);
            color: #229ED9;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            border: 1px solid rgba(34, 158, 217, 0.3);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        p.sub-title {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Features Box */
        .features {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            margin-bottom: 10px;
            color: #e0e0e0;
        }

        .feature-item:last-child {
            margin-bottom: 0;
        }

        .feature-icon {
            color: #25d366;
            font-weight: bold;
        }

        /* Animated Red Button */
        .cta-button {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ff1a1a, #cc0000);
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.5);
            animation: buttonPulse 1.5s infinite;
            transition: transform 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .cta-button:active {
            transform: scale(0.97);
        }

        /* Timer Indicator */
        .timer-text {
            margin-top: 18px;
            font-size: 12px;
            color: #888;
        }

        .timer-text span {
            color: #ff2a2a;
            font-weight: 700;
        }

        /* Animations Keyframes */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseGlow {
            from {
                box-shadow: 0 0 15px rgba(255, 42, 42, 0.4);
            }
            to {
                box-shadow: 0 0 30px rgba(255, 42, 42, 0.9);
            }
        }

        @keyframes buttonPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 26, 26, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(255, 26, 26, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 26, 26, 0);
            }
        }

<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20, #15102a, #06040a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Container & Entrance Animation */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px 25px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            animation: fadeInUp 0.8s ease-out forwards;
        }

        /* Logo Pulse Effect */
        .logo-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff2a2a;
            box-shadow: 0 0 20px rgba(255, 42, 42, 0.5);
            animation: pulseGlow 2s infinite alternate;
        }

        /* Typography & Badges */
        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 136, 204, 0.2);
            color: #229ED9;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            border: 1px solid rgba(34, 158, 217, 0.3);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        p.sub-title {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Features Box */
        .features {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            margin-bottom: 10px;
            color: #e0e0e0;
        }

        .feature-item:last-child {
            margin-bottom: 0;
        }

        .feature-icon {
            color: #25d366;
            font-weight: bold;
        }

        /* Animated Red Button */
        .cta-button {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ff1a1a, #cc0000);
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.5);
            animation: buttonPulse 1.5s infinite;
            transition: transform 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .cta-button:active {
            transform: scale(0.97);
        }

        /* Timer Indicator */
        .timer-text {
            margin-top: 18px;
            font-size: 12px;
            color: #888;
        }

        .timer-text span {
            color: #ff2a2a;
            font-weight: 700;
        }

        /* Animations Keyframes */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseGlow {
            from {
                box-shadow: 0 0 15px rgba(255, 42, 42, 0.4);
            }
            to {
                box-shadow: 0 0 30px rgba(255, 42, 42, 0.9);
            }
        }

        @keyframes buttonPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 26, 26, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(255, 26, 26, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 26, 26, 0);
            }
        }

<div id="pageContent"><style>

    background:#020202; color:#fff; font-family:'Poppins',sans-serif;

  }
  .bg-effects { position:fixed; inset:0; background:radial-gradient(circle at top center,#0d121c,#020202 60%); z-index:-2; }

    background-image:

      radial-gradient(circle at 50% 10%, rgba(255,184,77,.5) 1px, transparent 2px);
    background-size:150px 150px; opacity:.7; animation:drift 50s linear infinite;
  }
  @keyframes drift { 0%{transform:translateY(0);} 100%{transform:translateY(-150px);} }

  .card {
    background:#090c14; border:1px solid rgba(255,255,255,.05); border-radius:28px;
    width:100%; max-width:420px; padding:45px 15px 30px; text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.8); position:relative; margin-top:30px;
  }
  .profile-img {
    width:95px; height:95px; border-radius:50%; object-fit:cover;
    border:3px solid #090c14; position:absolute; top:-47px; left:50%;
    transform:translateX(-50%); background:#222; z-index:2;
  }
  .badge {
    display:inline-flex; align-items:center; gap:6px; background:transparent;
    color:#ffb84d; border:1px solid #ffb84d; padding:6px 16px; border-radius:20px;
    font-size:.75rem; font-weight:600; margin-bottom:25px; letter-spacing:.5px;
  }
  .title { font-size:2.2rem; font-weight:800; line-height:1.1; margin-bottom:15px; text-transform:uppercase; color:#fff; letter-spacing:-.5px; }
  .subtitle { font-size:1rem; color:#fff; margin-bottom:25px; font-weight:600; }
  .features { font-size:.9rem; color:#cbd5e1; line-height:1.8; margin-bottom:35px; padding:0 10px; }

  @keyframes breatheAndGlow {
    0% { transform:scale(1); box-shadow:0 0 10px rgba(255,140,0,.2); }
    50% { transform:scale(1.02); box-shadow:0 0 15px rgba(255,140,0,.4); }
    100% { transform:scale(1); box-shadow:0 0 10px rgba(255,140,0,.2); }
  }
  .btn {
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    background:linear-gradient(90deg,#ff9100 0%,#ff6600 100%); color:#fff;
    text-decoration:none; padding:18px 20px; border-radius:35px; font-weight:800;
    font-size:1.1rem; text-transform:uppercase; position:relative; z-index:1;
    margin-bottom:12px; letter-spacing:.5px; border:none; cursor:pointer;
    animation:breatheAndGlow 2.5s infinite ease-in-out; transition:filter .2s ease;
  }
  .btn:active { filter:brightness(.9); }
  .redirect-text { font-size:.8rem; color:#94a3b8; margin-bottom:25px; }

  .stats-container { display:flex; justify-content:space-between; border-top:1px solid rgba(255,255,255,.08); padding-top:25px; }
  .stat-box { flex:1; }
  .stat-value { color:#ffb84d; font-size:1.25rem; font-weight:800; margin-bottom:4px; }

    position:fixed; bottom:16px; right:16px; z-index:99999;
    background:#00ff9c; color:#04120c; border:none; font-weight:700;

<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20, #15102a, #06040a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Container & Entrance Animation */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px 25px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            animation: fadeInUp 0.8s ease-out forwards;
        }

        /* Logo Pulse Effect */
        .logo-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff2a2a;
            box-shadow: 0 0 20px rgba(255, 42, 42, 0.5);
            animation: pulseGlow 2s infinite alternate;
        }

        /* Typography & Badges */
        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 136, 204, 0.2);
            color: #229ED9;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            border: 1px solid rgba(34, 158, 217, 0.3);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        p.sub-title {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Features Box */
        .features {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            margin-bottom: 10px;
            color: #e0e0e0;
        }

        .feature-item:last-child {
            margin-bottom: 0;
        }

        .feature-icon {
            color: #25d366;
            font-weight: bold;
        }

        /* Animated Red Button */
        .cta-button {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ff1a1a, #cc0000);
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.5);
            animation: buttonPulse 1.5s infinite;
            transition: transform 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .cta-button:active {
            transform: scale(0.97);
        }

        /* Timer Indicator */
        .timer-text {
            margin-top: 18px;
            font-size: 12px;
            color: #888;
        }

        .timer-text span {
            color: #ff2a2a;
            font-weight: 700;
        }

        /* Animations Keyframes */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseGlow {
            from {
                box-shadow: 0 0 15px rgba(255, 42, 42, 0.4);
            }
            to {
                box-shadow: 0 0 30px rgba(255, 42, 42, 0.9);
            }
        }

        @keyframes buttonPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 26, 26, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(255, 26, 26, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 26, 26, 0);
            }
        }
    </style>

  function getConfig(){

      redirectSeconds: parseInt(b.getAttribute('data-redirect-seconds'), 10) || 10,

      particles = [];
      var count = Math.max(40, Math.floor((W * H) / 20000));
      var COLORS = ['255,32,121', '0,240,255', '204,255,0', '176,38,255'];
      for(var i = 0; i < count; i++){
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: 0.8 + Math.random() * 2,
          speed: 0.3 + Math.random() * 0.9,
          c: COLORS[i % COLORS.length]
        });
      }
    }
    window.addEventListener('resize', resize);
    resize();

    function drawSun(horizonY){
      var cx = W * 0.5;
      var r = Math.min(W, H) * 0.28;
      var grad = ctx.createRadialGradient(cx, horizonY, 0, cx, horizonY, r);
      grad.addColorStop(0, 'rgba(255,32,121,0.55)');
      grad.addColorStop(0.5, 'rgba(176,38,255,0.28)');
      grad.addColorStop(1, 'rgba(176,38,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, horizonY, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, horizonY, r * 0.62, 0, Math.PI * 2);
      ctx.clip();
      for(var i = 0; i < 6; i++){
        var y = horizonY - r * 0.62 + (i * r * 1.24) / 6;
        ctx.fillStyle = 'rgba(3,0,4,0.85)';
        ctx.fillRect(cx - r, y, r * 2, r * 0.09);
      }
      ctx.restore();
    }

    function drawGrid(horizonY){
      ctx.strokeStyle = 'rgba(0,240,255,0.4)';
      ctx.lineWidth = 1;
      var vanishX = W * 0.5;
      var spread = W * 0.9;
      for(var i = -12; i <= 12; i++){
        ctx.beginPath();
        ctx.moveTo(vanishX + i * 14, horizonY);
        ctx.lineTo(vanishX + i * spread, H);
        ctx.strokeStyle = 'rgba(255,32,121,' + (0.32 - Math.abs(i) * 0.012) + ')';
        ctx.stroke();
      }
      var rows = 14;
      for(var j = 0; j < rows; j++){
        var p = ((j + offset) % rows) / rows;
        var y = horizonY + Math.pow(p, 2.6) * (H - horizonY);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.strokeStyle = 'rgba(0,240,255,' + (0.5 * p) + ')';
        ctx.stroke();
      }
    }

    function drawParticles(){
      for(var i = 0; i < particles.length; i++){
        var p = particles[i];
        p.y -= p.speed;
        if(p.y < -5){ p.y = H + 5; p.x = Math.random() * W; }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + p.c + ',0.8)';
        ctx.shadowColor = 'rgba(' + p.c + ',1)';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function draw(){
      if(!document.getElementById('synthCanvas')){
        cancelAnimationFrame(animationId);
        synthCanvasStarted = false;
        return;
      }
      ctx.clearRect(0, 0, W, H);
      var horizonY = H * 0.42;
      drawSun(horizonY);
      drawGrid(horizonY);
      drawParticles();
      offset += 0.012;
      animationId = requestAnimationFrame(draw);
    }
    animationId = requestAnimationFrame(draw);
    document.addEventListener('visibilitychange', function(){
      if(document.hidden) cancelAnimationFrame(animationId);
      else animationId = requestAnimationFrame(draw);
    });
  }

    function autoTagLogoImage(container){
      // Auto-detect which <img> is the profile/brand photo, so photo upload
      // works on ANY pasted design without needing id="logoImg" by hand.
      // Never overrides an explicit id="logoImg" someone already set.
      if(container.querySelector('#logoImg')) return { assigned: false, mirrors: 0 };
      var imgs = Array.prototype.slice.call(container.querySelectorAll('img'));
      if(!imgs.length) return { assigned: false, mirrors: 0 };

      // Strongest signal: the same photo repeated in several spots (header,
      // hero, footer) — group images by identical src and take the largest group.
      var groups = {}, srcOrder = [];
      for(var i = 0; i < imgs.length; i++){
        var src = imgs[i].getAttribute('src') || '';
        if(!src) continue;
        if(!groups[src]){ groups[src] = []; srcOrder.push(src); }
        groups[src].push(imgs[i]);
      }
      var bestSrc = null;
      for(var j = 0; j < srcOrder.length; j++){
        var g = groups[srcOrder[j]];
        if(g.length > 1 && (!bestSrc || g.length > groups[bestSrc].length)) bestSrc = srcOrder[j];
      }

      var primary, rest = [];
      if(bestSrc){
        primary = groups[bestSrc][0];
        rest = groups[bestSrc].slice(1);
      } else {
        // No repeats — fall back to a keyword match on class/alt/id, else the first image.
        var keywordRe = /logo|avatar|profile|brand|channel|\bdp\b|\bpic\b/i;
        primary = null;
        for(var k = 0; k < imgs.length; k++){
          var hay = (imgs[k].className + ' ' + (imgs[k].getAttribute('alt') || '') + ' ' + imgs[k].id).toLowerCase();
          if(keywordRe.test(hay)){ primary = imgs[k]; break; }
        }
        if(!primary) primary = imgs[0];
      }

      primary.id = 'logoImg';
      for(var m = 0; m < rest.length; m++) rest[m].classList.add('logoImg-mirror');
      return { assigned: true, mirrors: rest.length };
    }

    function autoTagTextFields(container){
      var skipTags = {SCRIPT:1, STYLE:1, NOSCRIPT:1, SVG:1, PATH:1};
      var counter = 1;

      // Collect every meaningful text node first (walking live would break as we wrap).
      var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node){
          if(!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          var p = node.parentNode;
          while(p && p !== container){
            if(skipTags[p.tagName]) return NodeFilter.FILTER_REJECT;
            p = p.parentNode;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      var textNodes = [];
      var n;
      while((n = walker.nextNode())) textNodes.push(n);

      textNodes.forEach(function(node){
        var parent = node.parentNode;
        // If this text node is the parent's ONLY content, tag the parent directly —
        // keeps the original element and its styling intact.
        var parentIsSoleOwner = parent.childNodes.length === 1 && parent !== container;
        if(parentIsSoleOwner){
          if(parent.hasAttribute('data-field')) return;
          parent.setAttribute('data-field', 'autoText' + counter++);
        } else {
          // Mixed content (text sitting next to child elements) — wrap just this
          // text in a span so it becomes independently editable.
          var span = document.createElement('span');
          span.setAttribute('data-field', 'autoText' + counter++);
          span.textContent = node.nodeValue;
          parent.replaceChild(span, node);
        }
      });
    }

    function extractPageMarkup(raw){
      // If someone pastes a whole page's source (doctype/html/head/body, scripts,
      // wp-emoji-loader.js and all), pull out just the useful bits: any <style>
      // rules plus the body markup, with <script> tags stripped since they never
      // execute when injected via innerHTML anyway.
      if(!/<html[\s>]|<body[\s>]/i.test(raw)) return raw;
      try{
        var doc = new DOMParser().parseFromString(raw, 'text/html');
        if(!doc.body) return raw;
        // Dedupe by content: some sources repeat the exact same <style> block
        // twice (e.g. once in <head>, once elsewhere) — keep only the first.
        var seenStyles = {};
        var uniqueStyles = [];
        Array.prototype.forEach.call(doc.querySelectorAll('style'), function(st){
          var key = st.textContent.replace(/\s+/g, ' ').trim();
          if(seenStyles[key]) return;
          seenStyles[key] = true;
          uniqueStyles.push(st.outerHTML);
        });
        var styles = uniqueStyles.join('\n');
        Array.prototype.forEach.call(doc.body.querySelectorAll('script, noscript'), function(sc){ sc.remove(); });
        return (styles ? styles + '\n' : '') + doc.body.innerHTML.trim();
      } catch(e){
        return raw;
      }
    }

    function sanitizeTrackingConflicts(container){
      // Whatever gets pasted here in future — strip any tracking it brought
      // with it, so OUR pixel/dedup/currency setup is always the only thing
      // firing. Prevents duplicate or foreign Subscribe/PageView events.
      var removedOnclicks = 0, removedPixelImgs = 0, removedScripts = 0;
      Array.prototype.forEach.call(container.querySelectorAll('[onclick]'), function(el){
        var oc = el.getAttribute('onclick') || '';
        if(/fbq\s*\(/.test(oc)){
          el.removeAttribute('onclick');
          removedOnclicks++;
        }
      });
      Array.prototype.forEach.call(container.querySelectorAll('img[src*="facebook.com/tr"]'), function(img){
        img.remove();
        removedPixelImgs++;
      });
      Array.prototype.forEach.call(container.querySelectorAll('script'), function(sc){
        // Inert anyway once inserted via innerHTML, but keep the source clean.
        sc.remove();
        removedScripts++;
      });
      return { removedOnclicks: removedOnclicks, removedPixelImgs: removedPixelImgs, removedScripts: removedScripts };
    }

    function sanitizeForeignFonts(container){
      // Whatever gets pasted here in future often drags in @font-face rules or
      // <link> tags pointing at the ORIGINAL site's own domain (WordPress theme
      // fonts, etc). Those domains block cross-origin font loading (CORS), so
      // every font request fails and clutters the console — and in practice
      // it's also destabilized Meta's own Event Setup Tool script on the page.
      // Strip anything not from a trusted, CORS-friendly font/script host.
      var TRUSTED_HOSTS = ['fonts.googleapis.com', 'fonts.gstatic.com', 'cdnjs.cloudflare.com'];
      var removedFontFaces = 0, removedLinks = 0;

      function isTrusted(url){
        try{
          var host = new URL(url, window.location.href).hostname;
          for(var i = 0; i < TRUSTED_HOSTS.length; i++){
            if(host === TRUSTED_HOSTS[i] || host.slice(-(TRUSTED_HOSTS[i].length + 1)) === '.' + TRUSTED_HOSTS[i]) return true;
          }
          return false;
        }catch(e){ return true; } // relative/malformed URLs — leave alone, not the risk case
      }

      Array.prototype.forEach.call(container.querySelectorAll('style'), function(styleEl){
        var css = styleEl.textContent;
        var cleaned = css.replace(/@font-face\s*\{[^}]*\}/g, function(block){
          var urlMatch = block.match(/url\((['"]?)([^'")]+)\1\)/);
          if(urlMatch && /^https?:\/\//i.test(urlMatch[2]) && !isTrusted(urlMatch[2])){
            removedFontFaces++;
            return '';
          }
          return block;
        });
        if(cleaned !== css) styleEl.textContent = cleaned;
      });

      Array.prototype.forEach.call(container.querySelectorAll('link[href]'), function(linkEl){
        var href = linkEl.getAttribute('href') || '';
        if(/^https?:\/\//i.test(href) && !isTrusted(href)){
          linkEl.remove();
          removedLinks++;
        }
      });

      return { removedFontFaces: removedFontFaces, removedLinks: removedLinks };
    }

    function applyCustomHTML(){
      var raw = document.getElementById('customHtmlInput').value;
      var s = document.getElementById('status_customhtml');
      var pageContent = document.getElementById('pageContent');
      if(!raw.trim()){
        pageContent.innerHTML = '';
        document.getElementById('fieldList').innerHTML = '';
        s.textContent = 'Page cleared — paste new HTML above to rebuild it.';
        s.className = 'field-status';
        return;
      }
      var val = extractPageMarkup(raw);
      if(val !== raw){
        document.getElementById('customHtmlInput').value = val; // show the cleaned-up version
      }
      pageContent.innerHTML = val;
      var cleaned = sanitizeTrackingConflicts(pageContent);
      var fontsCleaned = sanitizeForeignFonts(pageContent);
      var logoResult = autoTagLogoImage(pageContent);
      autoTagTextFields(pageContent);
      rebindPageContent();
      var joinCount = getPageButtons().length;
      var cleanedParts = [];
      if(cleaned.removedOnclicks) cleanedParts.push(cleaned.removedOnclicks + ' inline tracking call' + (cleaned.removedOnclicks > 1 ? 's' : ''));
      if(cleaned.removedPixelImgs) cleanedParts.push(cleaned.removedPixelImgs + ' foreign pixel image' + (cleaned.removedPixelImgs > 1 ? 's' : ''));
      var cleanedNote = cleanedParts.length ? (' Removed ' + cleanedParts.join(' and ') + ' so only your Pixel ID tracks.') : '';
      var fontParts = [];
      if(fontsCleaned.removedFontFaces) fontParts.push(fontsCleaned.removedFontFaces + ' broken font rule' + (fontsCleaned.removedFontFaces > 1 ? 's' : ''));
      if(fontsCleaned.removedLinks) fontParts.push(fontsCleaned.removedLinks + ' external stylesheet link' + (fontsCleaned.removedLinks > 1 ? 's' : ''));
      var fontNote = fontParts.length ? (' Removed ' + fontParts.join(' and ') + ' pointing at an untrusted domain (would have failed to load and could destabilize the page).') : '';
      var logoNote = logoResult.assigned ? (' Detected the profile photo automatically' + (logoResult.mirrors ? (' (' + logoResult.mirrors + ' repeated spot' + (logoResult.mirrors > 1 ? 's' : '') + ' wired up too)') : '') + ' — Logo/Image upload will work on it.') : '';
      s.textContent = joinCount
        ? 'Updated — ' + joinCount + ' button' + (joinCount > 1 ? 's' : '') + ' detected and tracking attached.' + (val !== raw ? ' Cleaned up a full page source into just the visible markup.' : '') + cleanedNote + fontNote + logoNote
        : 'Updated — no buttons or links found in this HTML.' + cleanedNote + fontNote + logoNote;
      s.className = joinCount ? 'field-status ok' : 'field-status err';
    }

    function clearCustomHTML(){
      clearTimeout(customHtmlTimer);
      document.getElementById('customHtmlInput').value = '';
      applyCustomHTML();
      document.getElementById('customHtmlInput').focus();
    }

    var customHtmlTimer = null;
    document.getElementById('customHtmlInput').addEventListener('input', function(){
      clearTimeout(customHtmlTimer);
      var s = document.getElementById('status_customhtml');
      s.textContent = 'Editing…';
      s.className = 'field-status';
      customHtmlTimer = setTimeout(applyCustomHTML, 700);
    });

    function applyField(fieldId){
      var val = document.getElementById('ta_'+fieldId).value;
      document.querySelector('[data-field="' + fieldId + '"]').textContent = val;
      var s = document.getElementById('status_'+fieldId);
      s.textContent = 'Applied.';
      s.className = 'field-status ok';
    }

    function clearField(fieldId){
      document.getElementById('ta_'+fieldId).value = '';
      document.getElementById('ta_'+fieldId).focus();
    }

    async function callClaude(prompt){
      var response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 500, messages: [{ role: "user", content: prompt }] })
      });
      var data = await response.json();
      var textBlock = (data.content || []).find(function(b){ return b.type === 'text'; });
      return textBlock ? textBlock.text.trim() : '';
    }

    async function translateField(fieldId, mode){
      var textarea = document.getElementById('ta_'+fieldId);
      var statusEl = document.getElementById('status_'+fieldId);
      statusEl.textContent = 'Translating…';
      statusEl.className = 'field-status';
      try{
        var src = textarea.value;
        var instruction = mode === 'ta'
          ? 'Translate this short marketing/UI line into natural Tamil (Tamil script). Keep brand names, numbers, emoji and links unchanged. Return ONLY the translated line, nothing else:\n\n"' + src + '"'
          : 'Rewrite this short marketing/UI line into casual Tanglish (Tamil words spelled in Roman script, mixed naturally with English as commonly used in Tamil Nadu social media ads). Keep brand names, numbers, emoji and links unchanged. Return ONLY the result, nothing else:\n\n"' + src + '"';
        var result = await callClaude(instruction);
        textarea.value = result;
        applyField(fieldId);
        statusEl.textContent = 'Translated & applied.';
        statusEl.className = 'field-status ok';
      }catch(e){
        statusEl.textContent = 'Failed: ' + e.message;
        statusEl.className = 'field-status err';
      }
    }

    function generateFinalCode(){
      document.body.setAttribute('data-redirect-enabled', document.getElementById('enableRedirectCheckbox').checked ? 'true' : 'false');

      var clone = document.documentElement.cloneNode(true);
      clone.removeAttribute('id');
      if(clone.querySelector('body')) clone.querySelector('body').removeAttribute('id');
      var toggle = clone.querySelector('#editToggle');
      var panel = clone.querySelector('#editPanel');
      if(toggle) toggle.remove();
      if(panel) panel.remove();

      var html = '<!DOCTYPE html>\n' + clone.outerHTML;

      var section = document.getElementById('finalCodeSection');
      var output = document.getElementById('finalCodeOutput');
      output.value = html;
      section.style.display = 'block';
      output.focus();
      output.select();
      section.scrollIntoView({behavior:'smooth', block:'nearest'});

      var logoImgFinal = document.getElementById('logoImg');
      var logoSrc = logoImgFinal ? (logoImgFinal.getAttribute('src') || '') : '';
      var s = document.getElementById('status_finalcode');
      var notes = [];
      if(logoSrc.indexOf('data:') === 0){
        var approxKB = Math.round(logoSrc.length * 0.75 / 1024);
        notes.push('✓ Image embedded (~' + approxKB + ' KB)');
      } else {
        notes.push('⚠ No image uploaded — logo will be blank');
      }
      if(CONFIG.pixelId){
        notes.push('✓ Pixel ID set — Subscribe events will fire on click (Lead is being tracked separately via Meta\'s Event Setup Tool)');
      } else {
        notes.push('⚠ No Pixel ID set — tracking will stay silent until you add one');
      }
      s.textContent = notes.join('. ') + '. Total code: ' + html.length.toLocaleString() + ' characters. Tap Copy.';
      s.className = (logoSrc.indexOf('data:') === 0 && CONFIG.pixelId) ? 'field-status ok' : 'field-status err';
    }

    function copyFinalCode(){
      var output = document.getElementById('finalCodeOutput');
      var s = document.getElementById('status_finalcode');
      output.focus();
      output.select();
      try{
        navigator.clipboard.writeText(output.value).then(function(){
          s.textContent = 'Copied to clipboard.';
          s.className = 'field-status ok';
        }).catch(function(){
          fallbackCopy(s);
        });
      }catch(e){
        fallbackCopy(s);
      }
    }

    function fallbackCopy(s){
      try{
        document.execCommand('copy');
        s.textContent = 'Copied to clipboard.';
        s.className = 'field-status ok';
      }catch(e){
        s.textContent = 'Auto-copy blocked here — box is selected, just press Copy manually.';
        s.className = 'field-status err';
      }
    }

    window.applyTelegramLink = applyTelegramLink;
    window.applyPixelId = applyPixelId;
    window.applyEventValue = applyEventValue;
    window.applyField = applyField;
    window.clearField = clearField;
    window.translateField = translateField;
    window.applyCustomHTML = applyCustomHTML;
    window.clearCustomHTML = clearCustomHTML;
    window.redesignFromScreenshot = redesignFromScreenshot;
    window.applyButtonLink = applyButtonLink;
    window.useTelegramForButton = useTelegramForButton;
    window.generateFinalCode = generateFinalCode;
    window.copyFinalCode = copyFinalCode;

    // Auto-tag on initial load too — not just after a Page HTML edit — so a
    // page you paste into the file directly (like this one) is fully
    // editable/translatable from the start, no manual tagging or re-paste needed.
    sanitizeForeignFonts(document.getElementById('pageContent'));
    autoTagLogoImage(document.getElementById('pageContent'));
    autoTagTextFields(document.getElementById('pageContent'));
    updateLogoPlaceholder();
    buildButtonPanel();
    buildFieldPanel();
  }
</script>



</body></html>
